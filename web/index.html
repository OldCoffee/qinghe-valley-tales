<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>青禾谷物语</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 116 116'%3E%3Ccircle cx='58' cy='58' r='55' fill='%233d2410' stroke='%23ffd23f' stroke-width='5'/%3E%3Ccircle cx='58' cy='58' r='49' fill='%2387ceeb'/%3E%3Ccircle cx='58' cy='35' r='18' fill='%23ffd23f' stroke='%23fff3c4' stroke-width='3'/%3E%3Cpath d='M10 74 L38 34 L66 68 L86 40 L106 74 Z' fill='%232e6f40' stroke='%231e3a24' stroke-width='2'/%3E%3Cpath d='M8 72 L34 60 L68 64 L108 72 L100 98 L58 106 L18 98 Z' fill='%236abe30' stroke='%232e6f40' stroke-width='2'/%3E%3Cpath d='M50 64 L64 64 L80 104 L42 104 Z' fill='%233a86ff' stroke='%23fff3c4' stroke-width='1.5'/%3E%3Crect x='22' y='56' width='22' height='18' fill='%23f3e5be' stroke='%233d2410' stroke-width='2'/%3E%3Cpath d='M18 58 L33 43 L48 58 Z' fill='%23e0483e' stroke='%233d2410' stroke-width='2'/%3E%3Crect x='29' y='61' width='7' height='7' fill='%23ffd23f' stroke='%233d2410' stroke-width='1.5'/%3E%3Cpath d='M81 92 L81 50 M81 74 L67 62 L73 52 L81 64 Z M81 68 L95 56 L89 46 L81 58 Z' fill='%236abe30' stroke='%23ffd23f' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2b1b0e;
        --wood: #7a4a21;
        --wood-dark: #3d2410;
        --parchment: #f3e5be;
        --parchment-dim: #e8d8a8;
        --grass: #6abe30;
        --soil: #8a5a2b;
        --soil-wet: #5b3a1e;
        --water: #3a86ff;
        --gold: #ffd23f;
        --sky: #87ceeb;
        --night: #1b2340;
        --red: #e0483e;
      }
      * { box-sizing: border-box; border-radius: 0 !important; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: #1e3a24 repeating-conic-gradient(#24452b 0% 25%, #1e3a24 0% 50%) 0 0 / 32px 32px;
        color: var(--ink);
        font-family: 'VT323', 'PingFang SC', 'Microsoft YaHei', monospace;
        font-size: 20px;
        line-height: 1.35;
      }
      body.break-shake {
        animation: break-shake 0.42s steps(5);
      }
      h1, h2, h3 { font-family: 'Press Start 2P', 'PingFang SC', monospace; font-weight: 400; margin: 0 0 10px; }
      h2 { font-size: 17px; }
      h3 { font-size: 13px; margin-top: 14px; }
      button { font: inherit; color: inherit; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }

      /* 顶部 HUD (z-index: 10) */
      header.hud {
        position: sticky; top: 0; z-index: 10;
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
        background: var(--wood); color: #fff3c4;
        border-bottom: 4px solid var(--wood-dark);
        padding: 10px 16px;
        box-shadow: 0 4px 0 rgba(0,0,0,0.35);
      }
      header.hud h1 { font-size: 15px; margin: 0; text-shadow: 2px 2px 0 var(--wood-dark); }
      .loc-pill {
        background: #2b1b0e; color: var(--gold); border: 3px solid var(--gold);
        box-shadow: 0 3px 0 rgba(0,0,0,0.45);
        padding: 4px 12px; min-height: 40px; font-size: 20px;
        display: inline-flex; align-items: center; gap: 8px;
      }
      .loc-pill:hover { background: #3d2410; }
      .loc-pill small { color: #fff3c4; font-size: 15px; }
      #hud-gold { color: var(--gold); font-size: 24px; font-weight: bold; }
      #hud-bars { display: flex; gap: 10px; flex: 1; min-width: 220px; }
      .bar { position: relative; flex: 1; height: 22px; background: #201408; border: 3px solid var(--wood-dark); min-width: 120px; }
      .bar i { display: block; height: 100%; transition: width 200ms steps(6); }
      .bar.energy i { background: var(--grass); }
      .bar.hp i { background: var(--red); }
      .bar.xp i { background: var(--water); }
      .bar.warnbar i { background: var(--gold); }
      .bar.fx-hit { animation: hp-hit 0.36s steps(4); }
      .bar span { position: absolute; inset: 0; text-align: center; color: #fff; font-size: 17px; line-height: 18px; text-shadow: 1px 1px 0 #000; }

      /* 主页面切换导航条 (z-index: 10) */
      nav.page-nav {
        max-width: 1180px; margin: 14px auto 0; padding: 0 16px;
        display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
      }
      .nav-tab {
        background: var(--parchment-dim); border: 4px solid var(--wood-dark);
        box-shadow: 0 4px 0 var(--wood-dark);
        min-height: 52px; padding: 8px 12px;
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        font-size: 22px; text-align: left;
      }
      .nav-tab:hover { background: #fff3c4; }
      .nav-tab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dark); }
      .nav-tab.on {
        background: var(--gold);
        outline: 3px solid var(--wood-dark); outline-offset: -7px;
        font-weight: bold;
      }
      .nav-tab .nav-badge {
        background: var(--wood-dark); color: #fff3c4;
        padding: 1px 7px; font-size: 16px; line-height: 1.1;
      }
      .nav-tab.on .nav-badge { background: #2b1b0e; color: var(--gold); }
      .nav-tab .nav-badge.warn { background: var(--red); color: #fff; animation: pulse-warn 1.2s steps(2) infinite; }

      .pix-btn {
        background: var(--parchment); border: 3px solid var(--wood-dark);
        box-shadow: 0 4px 0 var(--wood-dark); padding: 6px 14px; min-height: 44px;
      }
      .pix-btn:hover { background: #fff3c4; }
      .pix-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dark); }
      .pix-btn.on { background: var(--gold); }
      .pix-btn.gold { background: var(--gold); }
      .pix-btn.ghost { background: transparent; color: #fff3c4; box-shadow: 0 4px 0 rgba(0,0,0,0.4); }
      .panel .pix-btn.ghost, #ui-modal .pix-btn.ghost { color: var(--ink); background: #e8d8a8; }
      header .pix-btn.ghost { border-color: var(--wood-dark); }
      .pix-btn.danger { background: #f0a49e; }
      .pix-btn.big { font-size: 24px; padding: 12px 18px; width: 100%; text-align: left; }
      .pix-btn.sleep { background: var(--night); color: var(--gold); border-color: var(--gold); }

      /* 单舞台主容器 */
      main.stage-wrap {
        max-width: 1180px; margin: 12px auto 14px; padding: 0 16px;
      }
      .panel {
        background: var(--parchment); border: 4px solid var(--wood-dark);
        box-shadow: 0 6px 0 rgba(0,0,0,0.35); padding: 18px;
        position: relative;
      }
      .page-view.enter { animation: page-enter 0.18s steps(3); }
      @keyframes page-enter {
        from { opacity: 0.5; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* 场景头与在场人物芯片条 */
      .scene-head {
        background: linear-gradient(var(--sky), #cdeac0);
        border: 3px solid var(--wood-dark);
        padding: 14px; margin: -4px -4px 14px;
      }
      .scene-head-top {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      }
      .scene-head p { margin: 6px 0 10px; }
      .scene-npcs {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        margin-top: 10px; padding-top: 10px; border-top: 2px dashed rgba(61,36,16,0.35);
      }
      .npc-pill {
        background: #fff8dc; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood-dark);
        padding: 4px 10px; min-height: 42px;
        display: inline-flex; align-items: center; gap: 8px;
      }
      .npc-pill:hover { background: var(--gold); }
      .npc-pill .mini-ava {
        width: 30px; height: 30px; background: transparent; border: none;
        display: inline-grid; place-items: center; font-weight: bold; overflow: hidden;
      }
      .npc-pill .mini-ava svg { width: 100%; height: 100%; display: block; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; align-items: center; }
      .sub-tabs {
        display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
        border-bottom: 3px solid var(--wood-dark); padding-bottom: 10px;
      }
      .sub-tab {
        background: #e8d8a8; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood-dark);
        padding: 6px 14px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px;
        font-size: 21px;
      }
      .sub-tab.on { background: var(--gold); font-weight: bold; }
      .sub-tab small {
        background: rgba(43,27,14,0.14); border: 2px solid var(--wood-dark);
        padding: 0 6px; font-size: 16px;
      }
      .hint, .dim { color: #6b5636; }
      .hint { font-size: 18px; }

      .seed-row, .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
      .chip {
        background: #fff8dc; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood-dark);
        padding: 4px 10px; min-height: 40px;
      }
      .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-dark); }
      .chip.on { background: var(--gold); }
      .chip.ok { background: #cdeac0; }
      .chip.foe { background: #f0a49e; }
      .chip.off { opacity: 0.6; }

      /* 农田网格与全状态视觉体系（VectorCraft 矢量分层版） */
      .farm-stage {
        position: relative;
        background: linear-gradient(180deg, #b88752 0%, #9b6b3b 100%);
        border: 4px solid var(--wood-dark);
        border-radius: 6px;
        box-shadow: inset 0 2px 0 rgba(255, 243, 196, 0.35), 0 4px 0 var(--wood-dark);
        padding: 10px;
        overflow: hidden;
      }
      .farm-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; overflow: hidden; }
      .tile {
        aspect-ratio: 1 / 0.88; border: 3px solid #2b1b0e; border-radius: 6px; padding: 4px 3px 8px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
        position: relative; overflow: hidden;
        box-shadow: inset -3px -4px 0 rgba(0,0,0,0.28), inset 3px 3px 0 rgba(255,255,255,0.2), 0 2px 0 rgba(43,27,14,0.45);
        transition: transform 0.08s ease, filter 0.12s ease;
      }
      .tile:hover { transform: translateY(-2px); filter: brightness(1.06); z-index: 2; }
      .farm-grid.enter .tile { animation: tile-pop 0.28s steps(3) backwards; animation-delay: var(--d, 0ms); }
      .tile b { width: 72%; max-width: 100%; max-height: 78%; aspect-ratio: 1; font-size: 24px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; margin: 0; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.42)); }
      .tile b svg { width: 100%; height: 100%; display: block; max-width: 100%; max-height: 100%; }
      .tile small {
        font-size: 13px; font-weight: bold; line-height: 1; text-align: center;
        text-shadow: 1px 1px 0 rgba(27, 16, 8, 0.9);
      }
      /* 1. 草地（已清理待开垦） */
      .tile.grass {
        background: #68b038;
        border-color: #2c5e14;
        color: #f4ffe8;
        box-shadow: inset 0 0 0 2px #8ad058, inset -3px -4px 0 #3f781e, 0 2px 0 rgba(43,27,14,0.45);
      }
      /* 2. 荒草地（未清理杂草） */
      .tile.weed {
        background: #4b8b28;
        border-color: #1e420e;
        color: #e6f7d4;
        box-shadow: inset 0 0 0 2px #68ad40, inset -3px -4px 0 #2b5714, 0 2px 0 rgba(43,27,14,0.45);
      }
      /* 3. 乱石地（压着巨石） */
      .tile.stone {
        background: #799462;
        border-color: #37474f;
        color: #eceff1;
      }
      /* 4. 干耕地（已开垦待播种 / 今日未浇水像素浅黄沙土） */
      .tile.dry {
        background: #bd824a;
        border-color: #5c3414;
        color: #fff3c4;
        box-shadow: inset 0 0 0 3px #d69c63, inset -3px -4px 0 #784820, 0 2px 0 rgba(43,27,14,0.45);
      }
      /* 5. 湿耕地（浇水后深巧克力湿润像素耕土） */
      .tile.wet {
        background: #341b0c;
        border-color: #180b04;
        color: #ffe8b8;
        box-shadow: inset 0 0 0 3px #4a2813, inset -3px -4px 0 #160903, 0 2px 0 rgba(43,27,14,0.45);
      }
      /* 6. 成熟可收获（丰收金辉，动作由植株弹跳驱动，不闪烁） */
      .tile.ready {
        background:
          radial-gradient(circle at 50% 36%, rgba(255, 249, 196, 0.45) 0%, transparent 68%),
          linear-gradient(180deg, #f2b728 0%, #c98212 100%);
        border-color: #fff3c4;
        color: #2b1b0e;
        box-shadow: inset 0 0 0 2px #ffd23f, 0 0 12px rgba(255, 210, 63, 0.65), 0 2px 0 #2b1b0e;
      }
      .tile.ready small { color: #2b1b0e; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65); }
      /* 7. 未解锁（温室未修复） */
      .tile.locked {
        background:
          repeating-linear-gradient(135deg, rgba(43, 27, 14, 0.16) 0 6px, transparent 6px 12px),
          linear-gradient(180deg, #5d665b 0%, #434a41 100%);
        border-color: #2b302a;
        color: #cfd8dc;
        opacity: 0.92;
      }
      /* 8. 枯萎（荒废灰褐） */
      .tile.wilted {
        background: linear-gradient(180deg, #857460 0%, #635544 100%);
        border-color: #3e352b;
        color: #dfd3b8;
      }
      /* 9. 肥沃土壤加成（金星微光边） */
      .tile.buff-fertile {
        box-shadow: inset 0 0 0 2px rgba(255, 213, 79, 0.65), inset -3px -4px 0 rgba(0,0,0,0.28), 0 2px 0 rgba(43,27,14,0.45);
      }
      .tile.weedy { box-shadow: inset 0 0 0 3px #4e9b2a, inset -4px -4px 0 rgba(0,0,0,0.18); }
      .farm-bulk-bar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        background: #fff3c4; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood-dark);
        padding: 8px 10px; margin: 0 0 10px;
      }
      .tile.selected { outline: 4px solid #4fc3f7; outline-offset: -5px; z-index: 3; box-shadow: 0 0 12px rgba(79, 195, 247, 0.75); }
      .tile .grow {
        position: absolute; left: 5px; right: 5px; bottom: 3px; height: 6px;
        background: rgba(20, 12, 4, 0.55); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 3px; overflow: hidden;
      }
      .tile .grow em { display: block; height: 100%; background: linear-gradient(90deg, #66bb6a, #9ccc65); }
      .tile.dry.crop-growing .grow em { background: linear-gradient(90deg, #ffb300, #ffd54f); }
      .tile.ready .grow em { background: linear-gradient(90deg, #ffd54f, #fff9c4); }

      /* 农事格子动作特效：工具挥动 + 植株与地块物理响应（不用颜色闪烁） */
      .tile.fx-till { animation: fx-till-thud 0.44s cubic-bezier(.22, 1.35, .5, 1); }
      .tile.fx-till b { animation: fx-soil-furrow-pop 0.44s ease-out; }
      .tile.fx-water b { animation: fx-water-revive 0.52s cubic-bezier(.2, 1.45, .45, 1); }
      .tile.fx-plant b { animation: fx-plant-sprout 0.48s cubic-bezier(.2, 1.5, .45, 1); display: inline-block; }
      .tile.fx-harvest b { animation: fx-harvest-pluck 0.5s cubic-bezier(.22, 1.45, .45, 1); }
      .tile.fx-clear.fx-sub-stone { animation: fx-stone-smash 0.46s steps(5); }
      .tile.fx-clear:not(.fx-sub-stone), .tile.fx-deweed { animation: fx-weed-rip 0.42s ease-out; }
      .tile.fx-uproot { animation: fx-uproot-heave 0.46s ease-out; }
      .tile .tile-float {
        position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
        background: #2b1b0e; color: var(--gold); border: 2px solid var(--gold);
        padding: 1px 6px; font-size: 13px; white-space: nowrap; z-index: 16;
        pointer-events: none; animation: float-up 0.75s steps(6) forwards;
        max-width: calc(100% - 8px); overflow: hidden; text-overflow: ellipsis;
      }

      /* 地块就近操作浮层 (Tile Popover, z-index: 15) */
      .tile-popover {
        position: sticky; top: 76px; z-index: 15;
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
        background: #cdeac0; border: 4px solid var(--wood-dark);
        box-shadow: 0 6px 0 rgba(0,0,0,0.4);
        padding: 12px 14px; margin-bottom: 12px;
      }
      .tile-popover-head { display: flex; align-items: center; gap: 10px; }
      .tile-popover-badge {
        background: var(--wood-dark); color: var(--gold);
        padding: 2px 8px; font-size: 19px; font-weight: bold;
      }
      .tile-ops { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; align-items: center; }
      .pix-btn.big-op { font-size: 21px; background: var(--gold); font-weight: bold; }

      /* 矿洞与战斗微动效 */
      .mine-arena {
        display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; margin: 12px 0;
      }
      .mine-box {
        background: #2b2623; color: #f3e5be; border: 3px solid var(--wood-dark);
        padding: 12px; position: relative; overflow: hidden;
      }
      .mine-box h4 { margin: 0 0 8px; color: var(--gold); font-size: 19px; }
      .rocks { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
      .rock {
        background: #7f858d; color: #fff; border: 3px solid #1c1e22;
        padding: 8px 12px; min-height: 44px; min-width: 48px;
        box-shadow: inset -4px -4px 0 rgba(0,0,0,0.35), 0 3px 0 #1c1e22;
        font-size: 20px; position: relative;
      }
      .rock:hover { background: #959ba3; }
      .rock.fx-rock-hit, .mine-box.fx-rock-hit {
        animation: rock-shake 0.34s steps(4);
      }
      .foe-list { display: grid; gap: 8px; }
      .foe-card {
        background: #472422; color: #ffe3de; border: 3px solid #1c1010;
        padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
        position: relative; overflow: hidden;
      }
      .foe-card.fx-slash {
        animation: foe-hit 0.38s steps(4);
      }
      .foe-card.fx-slash::before {
        content: ''; position: absolute; inset: -10px;
        background: linear-gradient(125deg, transparent 42%, #fff 46%, var(--gold) 50%, transparent 55%);
        pointer-events: none; animation: slash-sweep 0.34s steps(4) forwards;
      }
      .dmg-badge {
        background: var(--red); color: #fff; border: 2px solid #fff;
        padding: 1px 8px; font-weight: bold; font-size: 20px;
        animation: float-up 0.65s steps(5) forwards;
      }
      .dmg-badge.crit {
        background: var(--gold); color: #2b1b0e; border-color: #2b1b0e; font-size: 23px;
      }

      /* 矿洞层头提示横幅与森林玩法 */
      .mine-hint {
        display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
        background: #fff3c4; border: 3px solid var(--wood-dark);
        box-shadow: 0 3px 0 var(--wood-dark);
        padding: 8px 12px; margin: 10px 0 4px; font-size: 19px;
      }
      .mine-hint b { background: var(--wood-dark); color: var(--gold); padding: 1px 8px; }
      .forest-chop {
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
        background: #cdeac0; border: 3px solid var(--wood-dark);
        box-shadow: 0 4px 0 var(--wood-dark);
        padding: 12px 14px; margin-bottom: 8px;
      }
      .forest-chop.fx-chop { animation: rock-shake 0.34s steps(4); }
      .grove-card { display: flex; flex-direction: column; position: relative; }
      .grove-card .pix-btn { margin-top: auto; }
      .grove-card.fx-grove-pick { animation: fx-harvest-glow 0.45s steps(4); }

      /* 青禾森林：8 棵树多段砍伐舞台 + 可点击采集物块 + 奇遇翻牌卡 */
      .forage-stage {
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
        background: linear-gradient(180deg, #b8e39c 0%, #8ac968 100%);
        border: 3px solid var(--wood-dark); box-shadow: 0 4px 0 var(--wood-dark);
        padding: 12px 14px; margin: 8px 0 12px;
      }
      .forage-node {
        background: #fff8dc; border: 3px solid var(--wood-dark); box-shadow: 0 4px 0 var(--wood-dark);
        padding: 6px 12px; min-height: 48px; display: inline-flex; align-items: center; gap: 8px;
        position: relative; animation: bob-gentle 1.8s steps(2) infinite;
      }
      .forage-node:hover { background: var(--gold); transform: translateY(-2px); }
      .forage-node.unexplored { background: #5d8f4e; color: #fff8dc; border-style: dashed; }
      .forage-node.unexplored:hover { background: #6fa55d; }
      .forage-node.unexplored .forage-badge { background: #2f5427; }
      .grove-card.clickable { cursor: pointer; }
      .grove-card.clickable:hover { border-color: var(--gold); transform: translateY(-2px); }
      .mystery-single { margin-top: 8px; }
      .mystery-single .mystery-card { width: 100%; }
      .forage-node .forage-badge {
        background: var(--grass); color: #fff; border: 2px solid var(--wood-dark);
        padding: 1px 6px; font-size: 16px; font-weight: bold;
      }
      .forest-stage {
        background: linear-gradient(180deg, #cdeac0 0%, #9fd483 100%);
        border: 4px solid var(--wood-dark); box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12), 0 4px 0 var(--wood-dark);
        padding: 14px; margin-bottom: 12px;
      }
      .forest-stage-head {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
        margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px dashed rgba(61,36,16,0.35);
      }
      .forest-grid {
        display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
      }
      .tree-slot {
        background: #e9f7df; border: 3px solid var(--wood-dark);
        box-shadow: inset -4px -4px 0 rgba(0,0,0,0.12), 0 4px 0 var(--wood-dark);
        min-height: 112px; padding: 10px 8px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        position: relative; text-align: center;
      }
      .tree-slot:hover:not(:disabled) { background: #fff3c4; }
      .tree-slot.damaged { background: #ffe9a8; border-color: #7a4a21; }
      .tree-slot.stump {
        background: #b99976; color: #3d2410; opacity: 0.86;
        box-shadow: inset 3px 3px 0 rgba(0,0,0,0.2);
      }
      .tree-crown {
        line-height: 0; padding: 2px;
        filter: drop-shadow(2px 3px 0 rgba(61,36,16,0.35));
      }
      .tree-crown svg { width: 62px; height: 62px; display: block; }
      .tree-crown.stump-crown svg { width: 52px; height: 52px; margin-top: 10px; }
      .tree-slot:hover:not(:disabled) .tree-crown { transform: translateY(-2px); }
      .mystery-glyph svg { width: 30px; height: 30px; }
      .tree-hp-dots {
        display: inline-flex; gap: 4px; margin-top: 2px;
      }
      .tree-hp-dot {
        width: 12px; height: 10px; border: 2px solid var(--wood-dark); background: var(--grass);
      }
      .tree-hp-dot.lost { background: #d8c9a3; }
      .tree-slot.fx-tree-hit { animation: tree-hit-shake 0.34s steps(4); }
      .tree-slot.fx-tree-hit::after {
        content: ''; width: 18px; height: 6px; background: repeating-linear-gradient(90deg, #FFD54F 0 4px, transparent 4px 9px); image-rendering: pixelated; position: absolute; top: 6px; right: 10px;
        color: var(--soil); font-size: 18px; font-weight: bold;
        pointer-events: none; animation: fx-particles 0.36s steps(4) forwards;
      }
      .tree-slot.fx-tree-fall { animation: tree-fall-pop 0.44s steps(4); }
      .slot-float {
        position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
        background: #2b1b0e; color: var(--gold); border: 2px solid var(--gold);
        padding: 1px 8px; font-size: 16px; white-space: nowrap; z-index: 16;
        pointer-events: none; animation: float-up 0.8s steps(6) forwards;
      }

      /* 深林探索：三选一迷雾奇遇翻牌 */
      .mystery-grid {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 8px;
      }
      .mystery-card {
        background: #2b2338; color: #fff3c4; border: 4px solid var(--wood-dark);
        box-shadow: inset -4px -4px 0 rgba(0,0,0,0.35), 0 4px 0 var(--wood-dark);
        min-height: 132px; padding: 12px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        text-align: center; position: relative;
      }
      .mystery-card:hover:not(:disabled) {
        background: #3b2f4d; border-color: var(--gold); transform: translateY(-2px);
      }
      .mystery-card .mystery-glyph {
        width: 44px; height: 44px; display: grid; place-items: center;
        background: var(--wood); color: var(--gold); border: 3px solid var(--gold);
        font-size: 24px; font-weight: bold;
      }
      .mystery-card.revealed {
        background: #fff8dc; color: var(--ink); border-color: var(--gold);
        box-shadow: 0 0 0 3px var(--wood-dark), 0 4px 0 var(--wood-dark);
      }
      .mystery-card.revealed .mystery-glyph {
        background: var(--gold); color: var(--ink); border-color: var(--wood-dark);
      }
      .mystery-card.fx-card-flip { animation: card-flip-step 0.42s steps(4); }

      /* 水域钓鱼台（海滩 / 森林 / 山区通用） */
      .fishing-dock {
        display: grid; grid-template-columns: 1.05fr 1fr; gap: 14px;
        background: #e6f4ff; border: 4px solid var(--wood-dark);
        box-shadow: 0 4px 0 var(--wood-dark); padding: 14px; margin: 12px 0;
      }
      .water-pond {
        background: linear-gradient(180deg, #2d73b8 0%, #174270 100%);
        color: #fff; border: 4px solid var(--wood-dark);
        box-shadow: inset 0 -8px 0 rgba(0,0,0,0.28), 0 4px 0 var(--wood-dark);
        min-height: 138px; padding: 14px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        position: relative; overflow: hidden; text-align: center;
      }
      .water-pond:hover:not(:disabled) { filter: brightness(1.08); }
      .water-waves {
        font-size: 20px; letter-spacing: 6px; color: rgba(255,255,255,0.75);
        animation: wave-shift 1.6s steps(2) infinite;
      }
      .pond-bobber {
        display: inline-flex; align-items: center; gap: 8px;
        background: rgba(15, 31, 56, 0.82); border: 3px solid var(--gold);
        padding: 6px 14px; color: var(--gold); font-size: 22px; font-weight: bold;
        animation: bob-gentle 1.2s steps(2) infinite;
      }
      .dock-info {
        display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
        background: #fff8dc; border: 3px solid var(--wood-dark); padding: 10px 12px;
      }

      /* 可视化钓鱼拉锯战弹窗 */
      .fish-duel-pond {
        background: linear-gradient(180deg, #235c96 0%, #102e52 100%);
        color: #fff; border: 4px solid var(--wood-dark);
        box-shadow: inset 0 -8px 0 rgba(0,0,0,0.35);
        padding: 14px; margin: 10px 0 12px; position: relative; overflow: hidden;
      }
      .fish-duel-pond.struggle {
        background: linear-gradient(180deg, #6e2b32 0%, #2a1828 100%);
        border-color: var(--red); animation: rock-shake 0.36s steps(4);
      }
      .fish-duel-pond.rest {
        background: linear-gradient(180deg, #1f6b5c 0%, #123b47 100%);
        border-color: var(--grass);
      }
      .duel-state-banner {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        background: rgba(15, 24, 38, 0.85); border: 3px solid var(--gold);
        padding: 8px 12px; margin-bottom: 12px;
      }
      .fish-duel-pond.struggle .duel-state-banner { border-color: var(--red); color: #ffd4cf; }
      .fish-duel-pond.rest .duel-state-banner { border-color: var(--grass); color: #d4f7c5; }
      .duel-water-track {
        position: relative; height: 58px;
        background: rgba(0, 0, 0, 0.32); border: 3px solid rgba(255, 255, 255, 0.35);
        display: flex; align-items: center; padding: 0 12px;
      }
      .duel-shore {
        background: var(--wood); color: var(--gold); border: 2px solid var(--gold);
        padding: 2px 8px; font-size: 17px; font-weight: bold; z-index: 2;
      }
      .duel-fish-swim {
        position: absolute; top: 50%; transform: translate(-50%, -50%);
        background: var(--gold); color: var(--ink); border: 3px solid var(--wood-dark);
        padding: 2px 10px; font-weight: bold; font-size: 19px;
        transition: left 220ms steps(5); white-space: nowrap;
      }
      .fish-duel-pond.struggle .duel-fish-swim {
        background: var(--red); color: #fff; animation: bob-struggle 0.35s steps(3) infinite;
      }
      .duel-meters { display: grid; gap: 10px; margin: 12px 0; }
      .duel-meter-row {
        background: #fff8dc; border: 3px solid var(--wood-dark); padding: 8px 10px;
      }
      .duel-meter-row.tension-danger {
        background: #ffd9d4; border-color: var(--red);
        animation: pulse-warn 0.8s steps(2) infinite;
      }
      .duel-meter-head {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
      }
      .duel-btns {
        display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-top: 12px;
      }

      /* 卡片通用 */
      .cards { display: grid; gap: 10px; }
      .cards.grid-2 { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
      .card { background: #fff8dc; border: 3px solid var(--wood-dark); box-shadow: 0 4px 0 var(--wood-dark); padding: 12px; text-align: left; }
      button.card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dark); }
      .card.place { display: flex; justify-content: space-between; width: 100%; min-height: 56px; align-items: center; gap: 10px; }
      .card.place.on { background: var(--gold); }
      .card.npc { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
      .card.npc p { margin: 2px 0; font-size: 18px; }
      /* 社交卡优化布局：顶行（头像+名列+地点徽标）/ 全宽进度条 / 状态芯片行 / 整宽主按钮 */
      .npc-top { display: flex; gap: 12px; align-items: flex-start; }
      .npc-name-col { flex: 1; min-width: 0; }
      .npc-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 20px; }
      .npc-intro { color: #6b5636; font-size: 16px !important; line-height: 1.25; }
      .npc-loc-badge { flex: none; font-size: 14px; padding: 3px 8px; border: 2px solid var(--wood-dark); background: #e8e2d4; color: #6b5636; }
      .npc-loc-badge.on { background: #cdeac0; color: #2f5d23; font-weight: bold; }
      .card.npc .friend-bar { max-width: none; margin: 0; }
      .npc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .npc-chips .chip { cursor: default; font-size: 14px; padding: 3px 8px; }
      .npc-chips .chip:active { transform: none; box-shadow: 0 2px 0 var(--wood-dark); }
      .npc-main-btn { width: 100%; margin-top: auto; }
      .card.npc.away { background: #efe7d2; }
      .card.npc.away .avatar { filter: saturate(0.8); opacity: 0.92; }
      .card.npc.away .npc-intro, .card.npc.away .hearts { opacity: 0.65; }
      .card.npc.bday { border-color: #b8860b; box-shadow: 0 4px 0 #b8860b, 0 0 0 3px #ffe9a8; }
      .card.npc.npc-modal-card { flex-direction: row; align-items: flex-start; }
      .avatar {
        flex: 0 0 56px; width: 56px; height: 56px; background: transparent; border: none;
        display: grid; place-items: center; font-size: 26px; font-weight: bold; overflow: hidden;
      }
      .avatar svg { width: 100%; height: 100%; display: block; }
      .hearts { color: #e0483e; letter-spacing: 1px; }
      .card-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }

      /* 背包与装备整页 */
      .bag-shell { display: grid; gap: 14px; min-width: 0; }
      .bag-summary {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0;
        background: var(--wood); color: #fff3c4; border: 3px solid var(--wood-dark);
        box-shadow: 0 4px 0 var(--wood-dark);
      }
      .bag-summary > div { padding: 10px 12px; min-width: 0; }
      .bag-summary > div + div { border-left: 3px solid var(--wood-dark); }
      .bag-summary span, .bag-summary b { display: block; }
      .bag-summary span { font-size: 15px; color: var(--parchment-dim); line-height: 1; }
      .bag-summary b { font-size: 20px; line-height: 1.15; }
      .bag-summary .needs-repair { background: #8f2f27; color: #fff; }
      .bag-summary .needs-repair span { color: #ffd7d2; }
      .bag-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
      .bag-section-head h3 { margin: 0; }
      .bag-section-head span { color: #6b5636; font-size: 17px; }
      .equip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 10px; }
      .equip-card {
        background: #fff8dc; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood-dark);
        padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
        cursor: pointer; min-height: 136px;
      }
      .equip-card:hover { background: #fff3c4; }
      .equip-card.on { background: #ffe9a8; outline: 3px solid var(--grass); outline-offset: -6px; }
      .equip-card.broken { background: #f3c1ba; }
      .equip-card.low-dur { animation: pulse-warn 1.4s steps(2) infinite; }
      .equip-card.fx-wear { animation: acted 0.35s steps(3); }
      .equip-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; }
      .equip-title-row { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
      .equip-icon {
        width: 32px; height: 32px; flex: 0 0 32px; display: inline-grid; place-items: center;
        background: #fffdf7; border: 2px solid var(--wood-dark); border-radius: 4px;
      }
      .equip-icon svg { width: 26px; height: 26px; display: block; }
      .equip-meta { color: #6b5636; font-size: 17px; }
      .equip-card .bar { width: 100%; min-width: 0; flex: none; }
      .equip-note { font-size: 16px; line-height: 1.15; margin: 0; }
      .equip-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; width: 100%; }
      .badge { border: 2px solid var(--wood-dark); background: #d8c9a3; padding: 0 6px; font-size: 14px; }
      .badge.ok { background: var(--grass); color: #fff; }
      .badge.bad { background: var(--red); color: #fff; }
      .warn-text { color: #b3541e; }

      .bag-controls {
        background: #cdeac0; border: 3px solid var(--wood-dark); box-shadow: 0 4px 0 var(--wood-dark);
        padding: 10px;
      }
      .bag-filters {
        display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
      }
      .bag-filters .chip { display: inline-flex; align-items: center; gap: 6px; }
      .bag-filters .chip small {
        background: rgba(61,36,16,0.12); border: 2px solid rgba(61,36,16,0.35);
        min-width: 22px; padding: 0 4px; text-align: center;
      }
      .qty-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .bag-items-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px;
      }
      .bag-item {
        display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 10px;
        width: 100%; min-height: 62px; padding: 8px 10px; text-align: left;
        background: #fff8dc; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood-dark);
      }
      .bag-item:hover { background: #fff3c4; }
      .bag-item:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-dark); }
      .bag-item.on { background: var(--gold); outline: 3px solid var(--water); outline-offset: -6px; }
      .bag-item-icon {
        width: 42px; height: 42px; display: grid; place-items: center;
        background: #fffdf7; border: 3px solid var(--wood-dark); font-size: 23px; font-weight: bold;
        box-shadow: inset -3px -3px 0 rgba(0,0,0,0.12); overflow: hidden;
      }
      .bag-item-icon svg { width: 34px; height: 34px; display: block; }
      .forage-badge svg { width: 28px; height: 28px; display: block; }
      .bag-item-main { min-width: 0; display: grid; gap: 2px; }
      .bag-item-main b { line-height: 1.05; overflow-wrap: anywhere; }
      .bag-item-main small { color: #6b5636; font-size: 16px; line-height: 1.05; }
      .bag-item-qty { font-size: 21px; font-weight: bold; white-space: nowrap; }
      .bag-empty {
        display: grid; gap: 4px; padding: 18px 14px;
        background: #fff8dc; border: 3px dashed var(--wood); color: #6b5636;
      }
      .shipping-strip {
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
        background: #fff8dc; border: 3px solid var(--wood-dark); padding: 10px 12px;
      }
      .shipping-strip small { margin-left: auto; color: #6b5636; }

      /* 手册与状态页（技能 / 收集包房间卡 / 记录） */
      .skill-grid { display: grid; gap: 10px; margin: 10px 0; }
      .skill {
        display: flex; flex-direction: column; align-items: stretch; gap: 4px;
        background: #fff8dc; border: 3px solid var(--wood-dark); padding: 8px 12px;
      }
      .skill .skill-effect { color: #4e7a2a; }
      .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
      .room-card {
        background: #fff8dc; border: 3px solid var(--wood-dark); box-shadow: 0 4px 0 var(--wood-dark);
        padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left;
      }
      .room-card.done { background: #cdeac0; }
      .bundle-box {
        background: #fff8dc; border: 3px solid var(--wood-dark); padding: 12px; margin-bottom: 10px;
      }
      .bundle-box.done { background: #cdeac0; }
      .bundle-needs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

      /* 店铺与通用弹窗网格 */
      .bag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
      .item {
        background: #fff8dc; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood-dark);
        min-height: 78px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px;
      }
      .item b { font-size: 24px; display: inline-flex; align-items: center; justify-content: center; }
      .item b svg { width: 36px; height: 36px; display: block; }
      .item span { font-size: 16px; line-height: 1.05; text-align: center; }
      .item small { color: #6b5636; text-align: center; }
      .item.on { background: var(--gold); }
      .item.off { opacity: 0.62; box-shadow: none; cursor: default; }

      /* 详情列表样式 */
      .detail-title { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
      .detail-title b { font-size: 24px; display: block; }
      .detail-title span { color: #52634d; }
      .detail-list { margin: 0 0 12px; display: grid; gap: 6px; background: #fff8dc; border: 3px solid var(--wood-dark); padding: 10px 12px; }
      .detail-list > div {
        display: flex; justify-content: space-between; gap: 14px;
        border-top: 2px dashed rgba(61,36,16,0.3); padding-top: 6px;
      }
      .detail-list > div:first-child { border-top: 0; padding-top: 0; }
      .detail-list dt { color: #52634d; }
      .detail-list dd { margin: 0; text-align: right; font-weight: bold; }
      .detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

      /* 底部日志面板 */
      footer.log-panel {
        max-width: 1180px; margin: 0 auto 18px; padding: 0 16px;
      }
      #log {
        background: #201408; color: var(--parchment); border: 4px solid var(--wood-dark);
        box-shadow: 0 6px 0 rgba(0,0,0,0.35); padding: 10px 14px; max-height: 150px; overflow-y: auto;
      }
      .log-line.good { color: #9be15d; }
      .log-line.warn { color: var(--gold); }
      .log-line.bad { color: #ff9a92; }
      .log-line.love { color: #ffb3d9; }

      /* 多样化模态弹窗层 (z-index: 20) */
      #modal, #shop-modal, #ui-modal {
        position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
        background: rgba(20, 12, 4, 0.72); padding: 16px;
      }
      .modal-surface {
        background: var(--parchment); border: 4px solid var(--wood-dark); box-shadow: 0 8px 0 #000;
        width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px;
        animation: tile-pop 0.22s steps(3);
      }
      #modal-card { max-width: 560px; }
      #ui-modal-card { max-width: 720px; }
      #shop-modal-card { max-width: 1024px; }
      .modal-head {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
        background: var(--wood); color: #fff3c4; border: 3px solid var(--wood-dark);
        padding: 8px 12px; margin: -6px -6px 14px;
      }
      .modal-head h2 { margin: 0; font-size: 15px; }
      .modal-head .pix-btn { color: var(--ink); min-height: 38px; padding: 4px 12px; }
      .shop-head {
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
        background: var(--wood); color: #fff3c4; border: 3px solid var(--wood-dark);
        padding: 8px 12px; margin: -6px -6px 14px;
      }
      .shop-head h2 { margin: 0; font-size: 14px; }
      .shop-head .gold { color: var(--gold); font-size: 24px; }
      .shop-head .qty-row { margin: 0 0 0 auto; }
      .shop-head .chip, .shop-head .pix-btn { color: var(--ink); }
      .shop-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }
      .shop-grid section { min-width: 0; }
      .shop-bag { background: #cdeac0; border: 3px solid var(--wood-dark); padding: 10px; }
      .modal-btns { display: grid; gap: 10px; margin-top: 14px; }

      /* 浮动飘字反馈层 (z-index: 25) */
      #fx-toast-layer {

      /* 像素阶梯关键帧动画定义 */
      @keyframes tile-pop { from { transform: scale(0.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes acted { 0% { filter: brightness(1.7); } 100% { filter: brightness(1); } }
      @keyframes blink { 50% { filter: brightness(1.18); } }

        45% { transform: scale(0.88, 1.2) translateY(-8px); }
        100% { transform: scale(1, 1) translateY(0); }
      }
      @keyframes fx-stone-smash {

        20% { transform: translate(-6px, 3px) rotate(-3deg) scale(1.04, 0.92); }
        45% { transform: translate(6px, -2px) rotate(3deg); }
        70% { transform: translate(-4px, 1px); }
      }
      @keyframes fx-weed-rip {
        0%, 100% { transform: translateX(0); }
        30% { transform: translateX(-5px) skewX(-8deg); }
        65% { transform: translateX(4px) translateY(-3px) skewX(6deg); }
      }
      @keyframes fx-uproot-heave {
        0%, 100% { transform: translateY(0); }
        35% { transform: translateY(4px) rotate(-3deg); }
        70% { transform: translateY(-5px) rotate(3deg); }
      }
      @keyframes fx-harvest-glow {
        0% { transform: translateY(-3px) scale(1.04); }
        100% { transform: none; }
      }
      /* 六大农事操作的工具挥动 + 泥块/水珠/种子/草叶/果实/石屑飞溅层 */
      .tile-action-fx { position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }
      .tile-action-fx .fx-tool {
        position: absolute; top: 2px; right: 2px; width: 24px; height: 24px;
        transform-origin: 80% 80%; z-index: 9; filter: drop-shadow(1px 2px 0 rgba(27, 16, 8, 0.65));
      }
      .tile-action-fx .fx-tool svg { width: 24px; height: 24px; display: block; }
      .tile-action-fx .fx-tool-hoe, .tile-action-fx .fx-tool-pickaxe { animation: tool-chop-swing 0.44s cubic-bezier(.25, 1.3, .5, 1) forwards; }
      .tile-action-fx .fx-tool-can { left: 2px; right: auto; top: 2px; transform-origin: 30% 70%; animation: tool-can-pour 0.5s ease-in-out forwards; }
      .tile-action-fx .fx-tool-sweep { right: 2px; top: 6px; animation: tool-sickle-sweep 0.42s ease-out forwards; }
      @keyframes tool-chop-swing {
        0% { opacity: 1; transform: translate(6px, -10px) rotate(38deg) scale(0.9); }
        42% { opacity: 1; transform: translate(-8px, 10px) rotate(-48deg) scale(1.12); }
        75% { opacity: 1; transform: translate(-4px, 4px) rotate(-22deg) scale(1); }
        100% { opacity: 0; transform: translate(2px, -4px) rotate(10deg) scale(0.85); }
      }
      @keyframes tool-can-pour {
        0% { opacity: 1; transform: translate(-4px, -6px) rotate(-10deg); }
        35% { opacity: 1; transform: translate(4px, 2px) rotate(38deg) scale(1.06); }
        75% { opacity: 1; transform: translate(6px, 4px) rotate(44deg); }
        100% { opacity: 0; transform: translate(0, -4px) rotate(0deg) scale(0.85); }
      }
      @keyframes tool-sickle-sweep {
        0% { opacity: 1; transform: translate(14px, 4px) rotate(40deg) scale(0.9); }
        50% { opacity: 1; transform: translate(-18px, -4px) rotate(-55deg) scale(1.15); }
        100% { opacity: 0; transform: translate(-26px, -8px) rotate(-75deg) scale(0.85); }
      }
      .tile-action-fx .fx-harvest-fruit {
        position: absolute; left: 50%; top: 42%; width: 30px; height: 30px;
        transform: translate(-50%, -50%); z-index: 10;
        filter: drop-shadow(0 3px 0 rgba(27, 16, 8, 0.55));
        animation: harvest-fruit-arc 0.62s cubic-bezier(.2, 1.4, .45, 1) forwards;
      }
      .tile-action-fx .fx-harvest-fruit svg { width: 30px; height: 30px; display: block; }
      @keyframes harvest-fruit-arc {
        0% { opacity: 1; transform: translate(-50%, 4px) scale(0.5); }
        45% { opacity: 1; transform: translate(-50%, -12px) scale(1.08) rotate(-8deg); }
        78% { opacity: 1; transform: translate(-30%, -6px) scale(0.92) rotate(6deg); }
        100% { opacity: 0; transform: translate(-15%, 2px) scale(0.5) rotate(12deg); }
      }
      .tile-action-fx .fx-water-ring {
        position: absolute; left: 50%; bottom: 10px; width: 10px; height: 5px;
        border: 2px solid #81d4fa; transform: translateX(-50%);
        animation: water-splash-ring 0.48s ease-out forwards;
      }
      @keyframes water-splash-ring {
        0% { opacity: 0; transform: translateX(-50%) scale(0.4); }
        30% { opacity: 1; transform: translateX(-50%) scale(1); }
        100% { opacity: 0; transform: translateX(-50%) scale(3.2, 1.8); }
      }
      .tile-action-fx i {
        position: absolute; left: 50%; top: 52%; width: 6px; height: 6px;
        opacity: 0; animation: action-particle-burst 0.52s ease-out forwards;
      }
      .tile-action-fx .p1 { --px: -22px; --py: -22px; --pdy: 14px; --prot: -70deg; }
      .tile-action-fx .p2 { --px: 22px; --py: -24px; --pdy: 16px; --prot: 80deg; animation-delay: 25ms; }
      .tile-action-fx .p3 { --px: -12px; --py: -30px; --pdy: 10px; --prot: -45deg; animation-delay: 50ms; }
      .tile-action-fx .p4 { --px: 14px; --py: -16px; --pdy: 18px; --prot: 55deg; animation-delay: 35ms; }
      /* 开垦：深浅泥块向两侧抛起落下 */
      .fx-act-till i { background: #6d4c41; border: 1px solid #3e2723; width: 7px; height: 6px; }
      .fx-act-till .p2, .fx-act-till .p4 { background: #a1887f; }
      /* 浇水：弧线水珠洒下并溅开 */
      .fx-act-water i { background: #4fc3f7; border: 1px solid #0277bd; width: 5px; height: 7px; top: 24%; animation-name: water-drop-stream; }
      .fx-act-water .p1 { --px: -14px; --py: 18px; }
      .fx-act-water .p2 { --px: 14px; --py: 20px; }
      .fx-act-water .p3 { --px: -6px; --py: 22px; background: #b3e5fc; }
      .fx-act-water .p4 { --px: 8px; --py: 16px; background: #b3e5fc; }
      /* 播种：种子落入土窝 + 嫩绿碎叶弹出 */
      .fx-act-plant i { background: #dfc396; border: 1px solid #6d4c41; width: 5px; height: 5px; }
      .fx-act-plant .p3, .fx-act-plant .p4 { background: #66bb6a; border-color: #1b5e20; width: 6px; height: 4px; }
      /* 除草 / 清理荒草：连根草叶旋转飞散 */
      .fx-act-deweed i, .fx-act-clear i { background: #558b2f; border: 1px solid #1b4710; width: 9px; height: 4px; --py: -28px; }
      .fx-act-deweed .p2, .fx-act-clear .p2 { background: #8bc34a; }
      /* 清理石头：棱角石块向四周崩飞 */
      .fx-act-clear-stone i { background: #90a4ae; border: 1px solid #263238; width: 7px; height: 7px; }
      .fx-act-clear-stone .p2, .fx-act-clear-stone .p4 { background: #cfd8dc; width: 5px; height: 6px; }
      /* 收获：绿叶与金色丰收星粒伴随果实飞出 */
      .fx-act-harvest i { background: #66bb6a; border: 1px solid #1b5e20; width: 7px; height: 4px; }
      .fx-act-harvest .p2, .fx-act-harvest .p4 { background: #ffd54f; border-color: #e65100; width: 6px; height: 6px; }
      /* 铲除枯株：干褐断枝与土块被掀飞 */
      .fx-act-uproot i { background: #8d6e63; border: 1px solid #3e2723; width: 8px; height: 4px; }
      .fx-act-uproot .p2, .fx-act-uproot .p4 { background: #5d4037; width: 6px; height: 6px; }
      @keyframes action-particle-burst {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
        55% { opacity: 1; transform: translate(calc(-50% + var(--px, 16px)), calc(-50% + var(--py, -20px))) rotate(var(--prot, 45deg)) scale(1.1); }
        100% { opacity: 0; transform: translate(calc(-50% + var(--px, 16px) * 1.35), calc(-50% + var(--py, -20px) + var(--pdy, 14px))) rotate(calc(var(--prot, 45deg) * 1.8)) scale(0.65); }
      }
      @keyframes water-drop-stream {
        0% { opacity: 1; transform: translate(-50%, -18px) scale(0.8, 1.2); }
        65% { opacity: 1; transform: translate(calc(-50% + var(--px, 10px) * 0.6), calc(-50% + var(--py, 18px))) scale(1.1, 0.8); }
        100% { opacity: 0; transform: translate(calc(-50% + var(--px, 10px) * 1.3), calc(-50% + var(--py, 18px) - 6px)) scale(0.5); }
      }
      @keyframes float-up {
        0% { opacity: 1; transform: translate(-50%, 0); }
        80% { opacity: 1; transform: translate(-50%, -8px); }
        100% { opacity: 0; transform: translate(-50%, -12px); }
      }
      @keyframes rock-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px) rotate(-2deg); filter: brightness(1.5); }
        50% { transform: translateX(6px) rotate(2deg); }
        75% { transform: translateX(-4px); }
      }
      @keyframes tree-hit-shake {
        0%, 100% { transform: translateX(0) rotate(0); }
        25% { transform: translateX(-7px) rotate(-4deg); filter: brightness(1.35); }
        55% { transform: translateX(7px) rotate(4deg); }
        80% { transform: translateX(-4px); }
      }
      @keyframes tree-fall-pop {
        0% { transform: translateY(-6px) scale(1.06); filter: brightness(1.6); }
        50% { transform: translateY(6px) scale(0.92); }
        100% { transform: translateY(0) scale(1); filter: brightness(1); }
      }
      @keyframes card-flip-step {
        0% { transform: scaleX(0.15) translateY(-6px); filter: brightness(1.7); }
        55% { transform: scaleX(1.08) translateY(-3px); }
        100% { transform: scaleX(1) translateY(0); filter: brightness(1); }
      }
      @keyframes bob-gentle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes bob-struggle {
        0%, 100% { transform: translate(-50%, -50%) translateY(0); }
        50% { transform: translate(-50%, -50%) translateY(5px); }
      }
      @keyframes wave-shift {
        0%, 100% { transform: translateX(-4px); }
        50% { transform: translateX(4px); }
      }
      @keyframes foe-hit {
        0%, 100% { transform: translateX(0); }
        25% { background: #a82820; transform: translateX(7px); }
        60% { transform: translateX(-5px); }
      }
      @keyframes slash-sweep {
        0% { transform: translateX(-80%); opacity: 1; }
        100% { transform: translateX(80%); opacity: 0; }
      }
      @keyframes hp-hit {
        0%, 100% { transform: translateX(0); }
        30% { transform: translateX(-5px); filter: brightness(1.6); }
        70% { transform: translateX(5px); }
      }
      @keyframes pulse-warn {
        50% { outline: 3px solid var(--red); outline-offset: -3px; }
      }
      @keyframes break-shake {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(-8px, 3px); }
        40% { transform: translate(8px, -3px); }
        60% { transform: translate(-6px, -2px); }
        80% { transform: translate(6px, 2px); }
      }
      @keyframes toast-pop {
        from { opacity: 0; transform: translateX(14px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes night {
        0% { opacity: 0; }
        35% { opacity: 1; }
        70% { opacity: 1; background: #3a4a7a; }
        100% { opacity: 0; }
      }
      .shake { animation: rock-shake 0.3s steps(4); }

      @media (max-width: 900px) {
        #hud-bars { flex: 1 1 100%; order: 5; }
        nav.page-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .mine-arena, .shop-grid, .fishing-dock { grid-template-columns: 1fr; }
        .farm-grid { grid-template-columns: repeat(4, 1fr); }
        .forest-grid { grid-template-columns: repeat(2, 1fr); }
        .mystery-grid, .duel-btns { grid-template-columns: 1fr; }
        .bag-summary { grid-template-columns: 1fr; }
        .bag-summary > div + div { border-left: 0; border-top: 3px solid var(--wood-dark); }
        body { font-size: 19px; }
      }
      /* 居民互动：亲密度细进度条 */
      .friend-bar { position: relative; height: 16px; margin: 6px 0; background: #3a2a1e; border: 2px solid var(--wood-dark); overflow: hidden; max-width: 340px; }
      .friend-bar-fill { height: 100%; background: linear-gradient(90deg, #ff8fab, #e75480); transition: width .5s ease; }
      .friend-bar span { position: absolute; inset: 0; font-size: 11px; line-height: 14px; text-align: center; color: #fff8dc; text-shadow: 1px 1px 0 #000; }
      /* 居民互动动效：头像反应 */
      .avatar-wrap { position: relative; flex: none; }
      .avatar.fx-beloved, .avatar.fx-loved { animation: npcBounce .7s ease; }
      .avatar.fx-liked { animation: npcBounce .5s ease; }
      .avatar.fx-cheap, .avatar.fx-disliked { animation: npcShake .45s ease; filter: saturate(.6); }
      .avatar.fx-hated { animation: npcShake .55s ease; filter: saturate(.3) brightness(.85); }
      @keyframes npcBounce { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-10px) scale(1.12); } 55% { transform: translateY(2px) scale(1.04); } 100% { transform: translateY(0) scale(1); } }
      @keyframes npcShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
      /* 互动粒子：按评价档位上飘/下坠 */
      .npc-fx-particles { position: absolute; left: 50%; top: -6px; width: 0; height: 0; pointer-events: none; z-index: 3; }
      .npc-fx-particles span { position: absolute; font-size: 18px; opacity: 0; animation: heartFloat 1.4s ease-out forwards; animation-delay: calc(var(--i) * .12s); transform: translateX(calc((var(--i) - 2) * 13px)); }
      .npc-fx-particles.tone-cheap span, .npc-fx-particles.tone-disliked span, .npc-fx-particles.tone-hated span { animation-name: heartFall; }
      @keyframes heartFloat { 0% { opacity: 0; transform: translate(calc((var(--i) - 2) * 13px), 6px) scale(.6); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(calc((var(--i) - 2) * 16px), -52px) scale(1.25); } }
      @keyframes heartFall { 0% { opacity: 0; transform: translate(calc((var(--i) - 1) * 14px), -4px) scale(.7); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(calc((var(--i) - 1) * 18px), 34px) scale(.9) rotate(24deg); } }
      /* 互动评价气泡 */
      .npc-react { margin: 0 0 12px; padding: 8px 12px; border: 3px solid var(--wood-dark); background: #fff8dc; color: #4a3220; font-size: 15px; animation: reactPop .45s ease; }
      .npc-react.tone-beloved, .npc-react.tone-loved { background: #ffe3ee; border-color: #c14b78; }
      .npc-react.tone-cheap, .npc-react.tone-disliked { background: #e8e2d4; }
      .npc-react.tone-hated { background: #d8d3cc; border-color: #5a4a42; }
      @keyframes reactPop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
      /* 在场居民 pill 上的迷你粒子 */
      .npc-pill { position: relative; }
      .npc-pill.fx-beloved, .npc-pill.fx-loved, .npc-pill.fx-liked { animation: npcBounce .6s ease; }
      .npc-pill.fx-cheap, .npc-pill.fx-disliked, .npc-pill.fx-hated { animation: npcShake .45s ease; }
      .npc-pill-fx { position: absolute; left: 50%; top: -8px; pointer-events: none; }
      .npc-pill-fx span { position: absolute; font-size: 14px; opacity: 0; animation: heartFloat 1.2s ease-out forwards; animation-delay: calc(var(--i) * .12s); }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    
      /* --- 像素风: 图标锐化 + 农田 Debuff 无文字视觉 --- */
      .qh-pixel, .qh-svg-icon, .qh-svg-avatar, .qh-tile-svg, .qh-ui-icon { shape-rendering: crispEdges; image-rendering: pixelated; }
      .qh-ui-icon { width: 1.05em; height: 1.05em; vertical-align: -0.18em; display: inline-block; }
      .hearts .qh-ui-icon { width: 14px; height: 14px; vertical-align: -2px; }
      .badge svg, .chip svg { width: 14px; height: 14px; vertical-align: -2px; }
      h2 svg, h3 svg { width: 20px; height: 20px; vertical-align: -3px; }
      .pix-btn svg { width: 15px; height: 15px; vertical-align: -2px; }
      .npc-fx-particles span .qh-ui-icon, .npc-pill-fx span .qh-ui-icon { width: 18px; height: 18px; }
      .tile { position: relative; }
      .tile-debuffs { position: absolute; top: 2px; right: 2px; display: flex; gap: 1px; z-index: 3; pointer-events: none; }
      .tile-debuffs .qh-ui-icon { width: 15px; height: 15px; filter: drop-shadow(1px 1px 0 rgba(43,27,14,.65)); }
      .tile.debuff-thirsty {
        background: #c88d55;
        border-color: #5c3414;
        box-shadow: inset 0 0 0 3px #e6b88a, inset -3px -4px 0 #6e3814;
      }

      .tile.debuff-weeds { box-shadow: inset 0 0 0 3px #2e6f1e, inset -3px -4px 0 #14330a; }
      .tile.debuff-wilted { filter: saturate(.35) brightness(.82); box-shadow: inset 0 0 0 2px #6D4C41; }
      @keyframes thirsty-drop-bob { 0%, 100% { transform: translateY(0); } 55% { transform: translateY(3px) scaleY(1.08); } }

      /* --- 植物五态常驻姿态（根部轴心，错峰相位，纯位移/旋转/拉伸，不靠颜色闪烁） --- */
      .tile b { transform-origin: 50% 88%; }
      .tile.wet.crop-growing:not(.weedy) b {
        animation: crop-breeze-sway 2.8s ease-in-out infinite;
        animation-delay: var(--sway-d, 0ms);
      }
      .tile.ready:not(.weedy) b {
        animation: crop-ready-bounce 1.8s ease-in-out infinite;
        animation-delay: var(--sway-d, 0ms);
      }
      .tile.debuff-thirsty b {
        animation: crop-thirsty-droop 2.4s ease-in-out infinite;
        animation-delay: var(--sway-d, 0ms);

      .tile.weedy.crop-growing b, .tile.weedy.ready b {
        animation: crop-weed-squeezed 1.7s ease-in-out infinite;
        animation-delay: var(--sway-d, 0ms);

      .tile.wilted b {

        animation-delay: var(--sway-d, 0ms);
      }
      .tile.weed b {
        animation: wild-weed-sway 2.6s ease-in-out infinite;
        animation-delay: var(--sway-d, 0ms);
      }
      /* 有草状态：像素风锯齿野草簇前景 SVG 摇晃挤压植株 */
      .tile-weed-tuft {
        position: absolute; left: 50%; bottom: 6px; width: 68%; max-width: 56px; height: 18px;
        transform: translateX(-50%);
        pointer-events: none; z-index: 2;
      }
      .tile-weed-tuft svg {
        width: 100%; height: 100%; display: block;
        shape-rendering: crispEdges; image-rendering: pixelated;
        transform-origin: 50% 100%;
        animation: weed-choke-rustle 1.3s steps(3) infinite;
        animation-delay: var(--sway-d, 0ms);
      }
      @keyframes crop-breeze-sway {
        0%, 100% { transform: rotate(-2.5deg) scaleY(1); }
        50% { transform: rotate(2.5deg) translateY(-1px) scaleY(1.02); }
      }
      @keyframes crop-ready-bounce {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        35% { transform: translateY(1px) scale(1.04, 0.96); }
        70% { transform: translateY(-2px) scale(0.98, 1.03); }
      }
      @keyframes crop-thirsty-droop {
        0%, 100% { transform: rotate(4deg) translateY(1px) scale(1.02, 0.92); }
        50% { transform: rotate(6deg) translateY(2px) scale(1.03, 0.88); }
      }
      @keyframes crop-weed-squeezed {
        0%, 100% { transform: translateX(-1px) rotate(-3deg) scale(0.96, 0.97); }
        50% { transform: translateX(1px) rotate(-2deg) scale(0.94, 0.95); }
      }
      @keyframes crop-wilted-shiver {
        0%, 86%, 100% { transform: rotate(-5deg) translateY(1px) scaleY(0.92); }
        90% { transform: rotate(-7deg) translate(-1px, 1px) scaleY(0.91); }
        95% { transform: rotate(-3deg) translate(1px, 1px) scaleY(0.92); }
      }
      @keyframes wild-weed-sway {
        0%, 100% { transform: skewX(-2deg); }
        50% { transform: skewX(3deg) scaleY(1.02); }
      }
      @keyframes weed-choke-rustle {
        0%, 100% { transform: skewX(-8deg) scaleY(0.96); }
        50% { transform: skewX(10deg) scaleY(1.08); }
      }

      /* --- 点击地块的即时物理反馈（按地块状态差异化，不闪烁） --- */
      .tile.tap-crop b { animation: tap-crop-boing 0.42s cubic-bezier(.25, 1.5, .5, 1); }
      .tile.tap-thirsty b { animation: tap-thirsty-sag 0.52s ease-out; }
      .tile.tap-weedy b, .tile.tap-weed b { animation: tap-weed-rustle 0.44s ease-out; }
      .tile.tap-weedy .tile-weed-tuft svg { animation: tap-weed-rustle 0.38s steps(4); }
      .tile.tap-wilted b { animation: tap-wilted-crack 0.4s steps(4); }
      .tile.tap-stone b { animation: tap-stone-thud 0.34s steps(4); }
      .tile.tap-soil, .tile.tap-grass { animation: tap-soil-sink 0.3s ease-out; }
      @keyframes tap-crop-boing {
        0% { transform: scale(1, 1); }
        30% { transform: translateY(2px) scale(1.08, 0.9); }
        65% { transform: translateY(-2px) scale(0.95, 1.06) rotate(-2deg); }
        100% { transform: scale(1, 1); }
      }
      @keyframes tap-thirsty-sag {
        0% { transform: rotate(4deg) translateY(1px) scale(1.02, 0.92); }
        40% { transform: rotate(8deg) translateY(3px) scale(1.06, 0.84); }
        100% { transform: rotate(4deg) translateY(1px) scale(1.02, 0.92); }
      }
      @keyframes tap-weed-rustle {
        0%, 100% { transform: translateX(0) rotate(0); }
        20% { transform: translateX(-2px) rotate(-6deg) scale(1.03, 0.96); }
        50% { transform: translateX(2px) rotate(6deg) scale(0.97, 1.03); }
        75% { transform: translateX(-1px) rotate(-3deg); }
      }
      @keyframes tap-wilted-crack {
        0%, 100% { transform: rotate(-5deg) translateY(1px); }
        25% { transform: rotate(-9deg) translate(-1px, 2px) scale(1.02, 0.9); }
        60% { transform: rotate(-2deg) translate(1px, 1px); }
      }
      @keyframes tap-stone-thud {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-3px, 2px) scale(1.04, 0.94); }
        55% { transform: translate(3px, -1px); }
      }
      @keyframes tap-soil-sink {
        0%, 100% { transform: translateY(0); }
        40% { transform: translateY(3px) scale(1.02, 0.95); }
      }
      .tile-tap-fx { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
      .tile-tap-fx i {
        position: absolute; left: 50%; top: 48%; width: 5px; height: 5px;
        opacity: 0; animation: tap-particle-arc 0.46s ease-out forwards;
      }
      .tile-tap-fx .t1 { --tx: -16px; --ty: -18px; --rot: -45deg; }
      .tile-tap-fx .t2 { --tx: 15px; --ty: -20px; --rot: 50deg; animation-delay: 30ms; }
      .tile-tap-fx .t3 { --tx: 3px; --ty: -24px; --rot: 20deg; animation-delay: 55ms; }
      .tap-fx-crop i, .tap-fx-grass i { background: #66bb6a; border: 1px solid #1b5e20; width: 6px; height: 4px; }
      .tap-fx-weedy i, .tap-fx-weed i { background: #558b2f; border: 1px solid #1b4710; width: 7px; height: 3px; }
      .tap-fx-thirsty i { background: #a86f38; border: 1px solid #4e2c14; --ty: -8px; }
      .tap-fx-thirsty .t3 { background: #4fc3f7; border-color: #0277bd; --ty: -16px; }
      .tap-fx-wilted i { background: #8d6e63; border: 1px solid #3e2723; --ty: 8px; }
      .tap-fx-stone i { background: #cfd8dc; border: 1px solid #455a64; }
      .tap-fx-soil i { background: #8d5524; border: 1px solid #3e2723; --ty: -12px; }
      @keyframes tap-particle-arc {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(0.7); }
        65% { opacity: 1; transform: translate(calc(-50% + var(--tx, 10px)), calc(-50% + var(--ty, -14px))) rotate(var(--rot, 30deg)) scale(1.05); }
        100% { opacity: 0; transform: translate(calc(-50% + var(--tx, 10px) * 1.25), calc(-50% + var(--ty, -14px) + 10px)) rotate(calc(var(--rot, 30deg) * 1.6)) scale(0.6); }
      }

      /* --- 稀有度像素徽章 --- */
      .rarity-badge { display: inline-flex; align-items: center; gap: 3px; flex: none; }
      .rarity-badge svg { width: 17px; height: 17px; display: block; }

      /* --- 图鉴 --- */

      .codex-card { background: #fff8dc; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood-dark); padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }

      button.codex-card { cursor: pointer; font: inherit; color: inherit; width: 100%; } button.codex-card:hover { filter: brightness(1.05); transform: translateY(-1px); } .codex-card b { font-size: 14px; line-height: 1.15; }
      .codex-card small { font-size: 12px; }
      /* --- 主角顶栏、设置与存档弹窗 --- */
      .hud-player { display: inline-flex; align-items: center; gap: 6px; background: #fff8dc; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood-dark); padding: 2px 10px 2px 3px; font-weight: bold; color: var(--ink); white-space: nowrap; }
      .hud-player svg { width: 30px; height: 30px; display: block; }

      .modal-surface .bag-item-icon:has(> svg.qh-player-avatar) { width: 78px; height: 78px; flex: none; }
      .detail-title .bag-item-icon svg.qh-player-avatar { width: 64px; height: 64px; }
      .detail-title .bag-item-icon:has(> svg.qh-player-avatar) { width: 70px; height: 70px; }
      #create-name { border: 3px solid var(--wood-dark); background: #fffdf4; color: var(--ink); font-family: inherit; outline: none; }
      #create-name:focus { box-shadow: 0 0 0 3px #FFD54F; }

      /* 高级物品生成居中展示与飞入背包动效 (EffectCraft + FigCraft Spec) */
      #craft-reveal-layer {
        position: fixed; inset: 0; z-index: 60; pointer-events: none;
        display: none; align-items: center; justify-content: center;
      }
      #craft-reveal-layer.active { display: flex; }
      .craft-reveal-stage {
        position: relative; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
      }

        position: absolute; inset: 0; background: rgba(18, 12, 28, 0.72);

      }
      .craft-reveal-card {
        position: relative; width: 280px; padding: 20px 18px;
        background: #fff8dc; color: var(--ink);
        border: 5px solid #ffd54f; box-shadow: 0 0 38px rgba(255, 213, 79, 0.75), 0 8px 0 var(--wood-dark);
        display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
