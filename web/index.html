      }
      .craft-reveal-stage.rarity-tier-1 .craft-reveal-card { border-color: #66bb6a; box-shadow: 0 0 30px rgba(102, 187, 106, 0.7), 0 8px 0 var(--wood-dark); }
      .craft-reveal-stage.rarity-tier-2 .craft-reveal-card { border-color: #42a5f5; box-shadow: 0 0 36px rgba(66, 165, 245, 0.8), 0 8px 0 var(--wood-dark); }
      .craft-reveal-stage.rarity-tier-3 .craft-reveal-card { border-color: #ab47bc; box-shadow: 0 0 44px rgba(171, 71, 188, 0.9), 0 8px 0 var(--wood-dark); }
      .craft-reveal-stage.rarity-tier-4 .craft-reveal-card { border-color: #ffb300; box-shadow: 0 0 56px rgba(255, 179, 0, 0.98), 0 8px 0 var(--wood-dark); background: linear-gradient(180deg, #fffdf0 0%, #ffe082 100%); }
      .craft-reveal-rays {
        position: absolute; width: 340px; height: 340px; border-radius: 50%; z-index: -1;
        background: conic-gradient(from 0deg, transparent 0deg 20deg, rgba(255, 213, 79, 0.38) 20deg 40deg, transparent 40deg 60deg, rgba(255, 213, 79, 0.38) 60deg 80deg, transparent 80deg 100deg, rgba(255, 213, 79, 0.38) 100deg 120deg, transparent 120deg 140deg, rgba(255, 213, 79, 0.38) 140deg 160deg, transparent 160deg 180deg, rgba(255, 213, 79, 0.38) 180deg 200deg, transparent 200deg 220deg, rgba(255, 213, 79, 0.38) 220deg 240deg, transparent 240deg 260deg, rgba(255, 213, 79, 0.38) 260deg 280deg, transparent 280deg 300deg, rgba(255, 213, 79, 0.38) 300deg 320deg, transparent 320deg 340deg, rgba(255, 213, 79, 0.38) 340deg 360deg);
        animation: craft-rays-spin 4s linear infinite;
      }
      .craft-reveal-icon svg { width: 76px; height: 76px; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.28)); }
      .craft-reveal-tier { font-size: 16px; font-weight: bold; color: #8d4b00; background: rgba(255, 213, 79, 0.35); padding: 2px 10px; border: 2px solid var(--wood-dark); }
      .craft-reveal-name { font-size: 24px; color: var(--wood-dark); }
      .craft-reveal-sub { font-size: 16px; color: #5d341e; line-height: 1.25; }
      .craft-reveal-dest { font-size: 15px; color: #2e7d32; font-weight: bold; }
      .craft-reveal-sparks span {
        position: absolute; font-size: 22px; color: #ffd54f; text-shadow: 0 2px 0 #000;
        animation: craft-spark-float 0.9s ease-out infinite alternate;
      }
      .craft-reveal-sparks span:nth-child(1) { top: -18px; left: 12px; }
      .craft-reveal-sparks span:nth-child(2) { top: -22px; right: 16px; animation-delay: 0.15s; }
      .craft-reveal-sparks span:nth-child(3) { top: 45%; left: -22px; animation-delay: 0.25s; }
      .craft-reveal-sparks span:nth-child(4) { top: 45%; right: -22px; animation-delay: 0.35s; }
      .craft-reveal-sparks span:nth-child(5) { bottom: -18px; left: 26px; animation-delay: 0.2s; }
      .craft-reveal-sparks span:nth-child(6) { bottom: -18px; right: 26px; animation-delay: 0.4s; }
      .craft-reveal-stage.fly-to-bag .craft-reveal-card {
        animation: craft-fly-to-bag 0.56s cubic-bezier(0.45, 0, 0.2, 1) forwards;
      }
      .nav-tab.bag-catch-pulse {
        animation: bag-tab-catch 0.5s ease;
      }
      @keyframes craft-card-pop {
        0% { transform: scale(0.18) rotate(-8deg); opacity: 0; }
        55% { transform: scale(1.08) rotate(2deg); opacity: 1; }
        78% { transform: scale(0.97) rotate(0deg); opacity: 1; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      @keyframes craft-fly-to-bag {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--fly-x, -140px), var(--fly-y, -240px)) scale(0.16); opacity: 0.08; }
      }
      @keyframes craft-backdrop-fade {
        0%, 62% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes craft-rays-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes craft-spark-float {
        from { transform: translateY(0) scale(0.85); }
        to { transform: translateY(-8px) scale(1.2); }
      }
      @keyframes bag-tab-catch {
        0%, 100% { transform: scale(1); }
        45% { transform: scale(1.09); background: #ffe082; box-shadow: 0 0 18px #ffd54f; }
      }

      /* VectorCraft 设计的徽章 Logo 与 EffectCraft 页面刷新开幕动效 */
      .brand-logo {
        display: inline-flex; align-items: center; gap: 10px;
        background: linear-gradient(180deg, #fff6d6 0%, #f3e5be 100%);
        color: var(--ink); border: 3px solid var(--wood-dark);
        outline: 2px solid var(--gold); outline-offset: -5px;
        box-shadow: 0 3px 0 rgba(0,0,0,0.45);
        padding: 3px 12px 3px 6px;
      }
      .brand-logo-crest { width: 38px; height: 38px; display: block; flex: none; }
      .brand-logo-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05; }
      .brand-logo-title {
        font-family: 'Press Start 2P', 'PingFang SC', monospace;
        font-size: 14px; font-weight: bold; color: #5b3312;
        text-shadow: 1px 1px 0 #ffd23f;
      }
      .brand-logo-sub {
        margin-top: 2px; padding: 1px 6px;
        background: #2b1b0e; color: var(--gold); border: 1px solid var(--gold);
        font-size: 11px; letter-spacing: 0.5px;
      }
      .brand-logo.logo-land-pulse {
        animation: brand-logo-pulse 0.52s ease;
      }
      @keyframes brand-logo-pulse {
        0%, 100% { transform: scale(1); }
        45% { transform: scale(1.08); box-shadow: 0 0 22px #ffd23f, 0 3px 0 rgba(0,0,0,0.45); }
      }

      #page-refresh-layer {
        position: fixed; inset: 0; z-index: 80; pointer-events: none;
        display: none; overflow: hidden;
      }
      #page-refresh-layer.active { display: block; }
      .refresh-curtain {
        position: absolute; left: 0; right: 0; height: 50vh;
        background: linear-gradient(180deg, #3d2410 0%, #2b1b0e 100%);
        box-shadow: 0 0 36px rgba(0,0,0,0.7);
      }
      .refresh-curtain.top {
        top: 0; border-bottom: 4px solid var(--gold);
        animation: refresh-curtain-top 1.28s cubic-bezier(0.65, 0, 0.25, 1) forwards;
      }
      .refresh-curtain.bottom {
        bottom: 0; border-top: 4px solid var(--gold);
        animation: refresh-curtain-bottom 1.28s cubic-bezier(0.65, 0, 0.25, 1) forwards;
      }
      .refresh-halo {
        position: absolute; left: 50%; top: 50%; width: 320px; height: 320px;
        margin-left: -160px; margin-top: -160px;
        background: radial-gradient(circle, rgba(255, 210, 63, 0.92) 0%, rgba(106, 190, 48, 0.48) 48%, rgba(255, 210, 63, 0) 72%);
        filter: blur(2px);
        animation: refresh-halo-bloom 1.28s ease-out forwards;
      }
      .refresh-plaque-wrap {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      }
      .refresh-plaque {
        width: min(460px, 88vw);
        filter: drop-shadow(0 12px 26px rgba(0,0,0,0.65));
        animation: refresh-plaque-pop 0.62s cubic-bezier(0.18, 1.25, 0.35, 1) forwards;
      }
      #page-refresh-layer.glide-to-hud .refresh-plaque {
        animation: refresh-plaque-glide 0.62s cubic-bezier(0.5, 0, 0.2, 1) forwards;
      }
      body.page-refresh-enter header.hud,
      body.page-refresh-enter nav.page-nav,
      body.page-refresh-enter main.stage-wrap {
        animation: page-stage-rise 0.65s cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      body.page-refresh-enter nav.page-nav { animation-delay: 0.08s; }
      body.page-refresh-enter main.stage-wrap { animation-delay: 0.14s; }
      @keyframes refresh-curtain-top {
        0%, 44% { transform: translateY(0); }
        100% { transform: translateY(-106%); }
      }
      @keyframes refresh-curtain-bottom {
        0%, 44% { transform: translateY(0); }
        100% { transform: translateY(106%); }
      }
      @keyframes refresh-halo-bloom {
        0% { transform: scale(0.2); opacity: 0; }
        32% { transform: scale(1.08); opacity: 0.92; }
        65% { transform: scale(1.35); opacity: 0.72; }
        100% { transform: scale(1.85); opacity: 0; }
      }
      @keyframes refresh-plaque-pop {
        0% { transform: translateY(18px) scale(0.45); opacity: 0; }
        68% { transform: translateY(-3px) scale(1.06); opacity: 1; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }
      @keyframes refresh-plaque-glide {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--logo-dx, -320px), var(--logo-dy, -220px)) scale(0.36); opacity: 0; }
      }
      @keyframes page-stage-rise {
        0% { opacity: 0.35; transform: translateY(10px) scale(0.992); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* EffectCraft 睡觉星夜破晓与地点切换路牌独立转场动效 */
      #scene-fx-layer {
        position: fixed; inset: 0; z-index: 75; pointer-events: none;
        display: none; align-items: center; justify-content: center; overflow: hidden;
      }
      #scene-fx-layer.active { display: flex; }
      #scene-fx-layer.interactive { pointer-events: auto; }
      .sleep-fx-stage {
        position: relative; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 35%, #232c5c 0%, #141932 62%, #0c0f20 100%);
        animation: sleep-sky-sunny 1.38s ease-in-out forwards;
      }
      .sleep-fx-stage.weather-rain { animation-name: sleep-sky-rain; }
      .sleep-fx-stage.weather-storm { animation-name: sleep-sky-storm; }
      .sleep-fx-stage.weather-snow { animation-name: sleep-sky-snow; }
      .sleep-fx-stage.weather-night { animation-name: sleep-sky-night; }
      .sleep-fx-stars span {
        position: absolute; color: #fff3c4; font-size: 22px; text-shadow: 0 0 10px #ffd23f;
        animation: sleep-star-twinkle 0.8s ease-in-out infinite alternate;
      }
      .sleep-fx-stars span:nth-child(1) { top: 18%; left: 22%; }
      .sleep-fx-stars span:nth-child(2) { top: 24%; right: 24%; animation-delay: 0.2s; }
      .sleep-fx-stars span:nth-child(3) { top: 14%; left: 48%; animation-delay: 0.35s; }
      .sleep-fx-stars span:nth-child(4) { top: 34%; left: 16%; animation-delay: 0.15s; }
      .sleep-fx-stars span:nth-child(5) { top: 32%; right: 18%; animation-delay: 0.4s; }
      /* 雨天/暴风雨斜雨丝粒子 */
      .sleep-fx-rain { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .sleep-fx-rain i {
        position: absolute; top: -40px; width: 3px; height: 42px;
        background: linear-gradient(180deg, rgba(129,212,250,0), #81d4fa);
        transform: rotate(14deg);
        animation: sleep-rain-drop 0.52s linear infinite;
      }
      .sleep-fx-rain i:nth-child(1) { left: 16%; animation-delay: 0s; }
      .sleep-fx-rain i:nth-child(2) { left: 26%; animation-delay: 0.18s; }
      .sleep-fx-rain i:nth-child(3) { left: 37%; animation-delay: 0.08s; }
      .sleep-fx-rain i:nth-child(4) { left: 48%; animation-delay: 0.28s; }
      .sleep-fx-rain i:nth-child(5) { left: 59%; animation-delay: 0.14s; }
      .sleep-fx-rain i:nth-child(6) { left: 70%; animation-delay: 0.34s; }
      .sleep-fx-rain i:nth-child(7) { left: 80%; animation-delay: 0.06s; }
      .sleep-fx-rain i:nth-child(8) { left: 88%; animation-delay: 0.22s; }
      .sleep-fx-flash {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 32%, rgba(255, 249, 196, 0.75), rgba(149, 117, 205, 0.25) 60%, transparent 100%);
        animation: sleep-storm-flash 1.36s ease-out forwards;
      }
      /* 雪天飘雪粒子 */
      .sleep-fx-snow { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .sleep-fx-snow span {
        position: absolute; top: 8%; color: #ffffff; font-size: 24px;
        text-shadow: 0 0 10px #81d4fa;
        animation: sleep-snow-fall 1.25s ease-in-out infinite;
      }
      .sleep-fx-snow span:nth-child(1) { left: 18%; animation-delay: 0s; }
      .sleep-fx-snow span:nth-child(2) { left: 31%; top: 16%; animation-delay: 0.18s; }
      .sleep-fx-snow span:nth-child(3) { left: 45%; top: 10%; animation-delay: 0.32s; }
      .sleep-fx-snow span:nth-child(4) { left: 60%; top: 14%; animation-delay: 0.12s; }
      .sleep-fx-snow span:nth-child(5) { left: 74%; top: 18%; animation-delay: 0.26s; }
      .sleep-fx-snow span:nth-child(6) { left: 84%; top: 12%; animation-delay: 0.4s; }
      /* 纯圆形 SVG 天象容器：无背景盒、无 box-shadow、无 drop-shadow 离屏纹理（彻底消除任何方框伪影） */
      .sleep-fx-orb {
        width: 144px; height: 144px;
        border-radius: 50% !important;
        background: transparent !important;
        border: 0 !important;
        outline: none !important;
        box-shadow: none !important;
        filter: none !important;
        display: flex; align-items: center; justify-content: center;
        animation: sleep-orb-arc 1.32s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
      }
      .sleep-fx-orb svg { width: 144px; height: 144px; display: block; background: transparent !important; border: 0 !important; box-shadow: none !important; filter: none !important; }
      .sleep-fx-stage.weather-rain .sleep-fx-orb { animation-name: sleep-orb-rain; }
      .sleep-fx-stage.weather-storm .sleep-fx-orb { animation-name: sleep-orb-storm; }
      .sleep-fx-stage.weather-snow .sleep-fx-orb { animation-name: sleep-orb-snow; }
      .sleep-fx-card {
        margin-top: 18px; padding: 14px 28px;
        background: rgba(27, 35, 64, 0.92); color: #fff3c4;
        border: 4px solid #ffd23f; box-shadow: 0 8px 0 #0c0f20, 0 0 28px rgba(255, 210, 63, 0.45);
        text-align: center;
        animation: sleep-card-rise 1.32s ease forwards;
      }
      .sleep-fx-card b { display: block; font-size: 26px; color: #ffd23f; margin-bottom: 4px; }
      .sleep-fx-card span { font-size: 19px; color: #fff3c4; }
      .sleep-fx-stage.weather-rain .sleep-fx-card {
        background: rgba(18, 38, 58, 0.94); border-color: #4fc3f7;
        box-shadow: 0 8px 0 #0a1520, 0 0 28px rgba(79, 195, 247, 0.45);
      }
      .sleep-fx-stage.weather-rain .sleep-fx-card b { color: #81d4fa; }
      .sleep-fx-stage.weather-storm .sleep-fx-card {
        background: rgba(26, 20, 46, 0.94); border-color: #ffd54f;
        box-shadow: 0 8px 0 #0d091a, 0 0 28px rgba(179, 136, 255, 0.55);
      }
      .sleep-fx-stage.weather-storm .sleep-fx-card b { color: #ffd54f; }
      .sleep-fx-stage.weather-snow .sleep-fx-card {
        background: rgba(24, 42, 64, 0.94); border-color: #b3e5fc;
        box-shadow: 0 8px 0 #0c1826, 0 0 28px rgba(179, 229, 252, 0.5);
      }
      .sleep-fx-stage.weather-snow .sleep-fx-card b { color: #e1f5fe; }
      @keyframes sleep-sky-sunny {
        0% { opacity: 0; }
        18%, 56% { opacity: 0.96; background: radial-gradient(circle at 50% 35%, #232c5c 0%, #141932 62%, #0c0f20 100%); }
        82% { opacity: 0.94; background: radial-gradient(circle at 50% 42%, #ffd23f 0%, #ff9e44 45%, #3a86ff 100%); }
        100% { opacity: 0; }
      }
      @keyframes sleep-sky-rain {
        0% { opacity: 0; }
        18%, 56% { opacity: 0.96; background: radial-gradient(circle at 50% 35%, #16283d 0%, #0e1a28 65%, #081019 100%); }
        82% { opacity: 0.94; background: radial-gradient(circle at 50% 40%, #2c5378 0%, #1b3652 55%, #102236 100%); }
        100% { opacity: 0; }
      }
      @keyframes sleep-sky-storm {
        0% { opacity: 0; }
        18%, 56% { opacity: 0.97; background: radial-gradient(circle at 50% 35%, #1f1838 0%, #120e24 65%, #090714 100%); }
        82% { opacity: 0.95; background: radial-gradient(circle at 50% 38%, #3c2a66 0%, #21183b 55%, #110c21 100%); }
        100% { opacity: 0; }
      }
      @keyframes sleep-sky-snow {
        0% { opacity: 0; }
        18%, 56% { opacity: 0.96; background: radial-gradient(circle at 50% 35%, #1d314a 0%, #122033 65%, #0a1320 100%); }
        82% { opacity: 0.94; background: radial-gradient(circle at 50% 42%, #5c8ab5 0%, #34587d 52%, #1d354f 100%); }
        100% { opacity: 0; }
      }
      @keyframes sleep-sky-night {
        0% { opacity: 0; }
        18%, 80% { opacity: 0.96; background: radial-gradient(circle at 50% 35%, #232c5c 0%, #141932 62%, #0c0f20 100%); }
        100% { opacity: 0; }
      }
      @keyframes sleep-orb-arc {
        0% { transform: translate(-110px, 28px) scale(0.55); opacity: 0; }
        35% { transform: translate(0, -12px) scale(1); opacity: 1; }
        75% { transform: translate(65px, -4px) scale(1.15); opacity: 1; }
        100% { transform: translate(120px, 16px) scale(1.28); opacity: 0; }
      }
      @keyframes sleep-orb-rain {
        0% { transform: translateY(-48px) scale(0.7); opacity: 0; }
        32% { transform: translateY(-6px) scale(1); opacity: 1; }
        78% { transform: translateY(4px) scale(1.06); opacity: 1; }
        100% { transform: translateY(24px) scale(0.95); opacity: 0; }
      }
      @keyframes sleep-orb-storm {
        0% { transform: scale(0.65); opacity: 0; }
        28% { transform: scale(1.08); opacity: 1; }
        48% { transform: translate(-4px, 2px) scale(0.98); opacity: 1; }
        68% { transform: translate(4px, -2px) scale(1.12); opacity: 1; }
        100% { transform: scale(0.92); opacity: 0; }
      }
      @keyframes sleep-orb-snow {
        0% { transform: translateY(-30px) rotate(-35deg) scale(0.65); opacity: 0; }
        35% { transform: translateY(-6px) rotate(0deg) scale(1); opacity: 1; }
        78% { transform: translateY(2px) rotate(35deg) scale(1.08); opacity: 1; }
        100% { transform: translateY(18px) rotate(60deg) scale(0.95); opacity: 0; }
      }
      @keyframes sleep-rain-drop {
        from { transform: translate(0, -20px) rotate(14deg); opacity: 0; }
        30% { opacity: 0.9; }
        to { transform: translate(-36px, 520px) rotate(14deg); opacity: 0; }
      }
      @keyframes sleep-storm-flash {
        0%, 24%, 52%, 100% { opacity: 0; }
        30% { opacity: 0.72; }
        62% { opacity: 0.45; }
      }
      @keyframes sleep-snow-fall {
        0% { transform: translate(0, -16px) rotate(0deg); opacity: 0; }
        25% { opacity: 0.95; }
        100% { transform: translate(18px, 340px) rotate(120deg); opacity: 0; }
      }
      @keyframes sleep-card-rise {
        0% { transform: translateY(18px) scale(0.9); opacity: 0; }
        24%, 78% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-10px) scale(0.96); opacity: 0; }
      }
      @keyframes sleep-star-twinkle {
        from { transform: scale(0.8); opacity: 0.45; }
        to { transform: scale(1.25); opacity: 1; }
      }

      /* 爷爷的午后向日葵田梦境（第三年春天）：暖阳晴空 + 4株向日葵逐株盛放 + 羊皮纸小本子 + 手动醒来/10秒自动关闭 */
      .grandpa-eval-fx {
        background: radial-gradient(circle at 50% 28%, rgba(254, 240, 138, 0.96) 0%, rgba(186, 230, 253, 0.94) 55%, rgba(134, 239, 172, 0.92) 100%);
        animation: eval-dream-sky 10s ease-in-out forwards;
      }
      .grandpa-eval-fx.eval-tier-1 {
        background: radial-gradient(circle at 50% 28%, rgba(254, 249, 195, 0.95) 0%, rgba(186, 230, 253, 0.94) 58%, rgba(167, 243, 208, 0.92) 100%);
      }
      .grandpa-eval-fx.eval-tier-2 {
        background: radial-gradient(circle at 50% 28%, rgba(254, 240, 138, 0.96) 0%, rgba(125, 211, 252, 0.94) 56%, rgba(134, 239, 172, 0.92) 100%);
      }
      .grandpa-eval-fx.eval-tier-3 {
        background: radial-gradient(circle at 50% 28%, rgba(253, 224, 71, 0.96) 0%, rgba(254, 240, 138, 0.94) 56%, rgba(163, 230, 53, 0.9) 100%);
      }
      .grandpa-eval-fx.eval-tier-4 {
        background: radial-gradient(circle at 50% 25%, rgba(254, 240, 138, 0.98) 0%, rgba(253, 224, 71, 0.95) 52%, rgba(134, 239, 172, 0.94) 100%);
      }
      .dream-sunbeams { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .dream-sunbeams i {
        position: absolute; top: -15%; width: 120px; height: 130%;
        background: linear-gradient(180deg, rgba(255, 251, 235, 0.48) 0%, rgba(254, 240, 138, 0.08) 80%, transparent 100%);
        transform: rotate(-18deg);
      }
      .dream-sunbeams i:nth-child(1) { left: 22%; }
      .dream-sunbeams i:nth-child(2) { left: 48%; width: 160px; }
      .dream-sunbeams i:nth-child(3) { left: 72%; }
      .eval-shrine { animation: eval-shrine-rise 10s ease forwards; }
      .eval-shrine svg { display: block; background: transparent !important; border: 0 !important; box-shadow: none !important; filter: none !important; }
      .eval-sunflower { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; animation: eval-sunflower-bloom 0.72s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
      .eval-card {
        max-width: min(680px, 92vw);
        background: #fffbeb !important;
        color: #451a03 !important;
        border: 5px solid #8d5b2c !important;
        outline: 3px solid #d99b43;
        outline-offset: -8px;
        box-shadow: 0 10px 0 #5c3818, 0 0 32px rgba(251, 191, 36, 0.55) !important;
        animation: eval-card-stay 10s ease forwards !important;
      }
      .eval-card b { color: #92400e !important; font-size: 24px; }
      .eval-card .eval-score-line { display: block; margin-top: 4px; color: #78350f !important; font-weight: bold; }
      .eval-card .eval-notes {
        display: block; margin-top: 8px; padding: 8px 14px;
        background: #fef3c7; border: 2px dashed #d99b43;
        font-size: 16px; line-height: 1.5; color: #451a03 !important; text-align: left;
      }
      .eval-card .eval-notes span { display: block; color: #451a03 !important; font-size: 16px; }
      .eval-card .eval-quote { display: block; margin-top: 10px; font-size: 19px; font-weight: bold; color: #b45309 !important; }
      .eval-actions { margin-top: 12px; display: flex; justify-content: center; }
      .eval-wake-btn {
        padding: 8px 22px; font-size: 18px; font-weight: bold; cursor: pointer;
        background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
        color: #fffbeb; border: 3px solid #78350f;
        box-shadow: 0 4px 0 #451a03;
      }
      .eval-wake-btn:hover { filter: brightness(1.08); }
      .eval-wake-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #451a03; }
      .grandpa-eval-fx.eval-tier-4 .eval-card {
        border-color: #b45309 !important;
        outline-color: #fbbf24;
        box-shadow: 0 10px 0 #5c3818, 0 0 48px rgba(250, 204, 21, 0.85) !important;
      }
      @keyframes eval-dream-sky {
        0% { opacity: 0; }
        6%, 94% { opacity: 0.98; }
        100% { opacity: 0; }
      }
      @keyframes eval-shrine-rise {
        0% { transform: translateY(14px) scale(0.94); opacity: 0; }
        8%, 94% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-6px) scale(0.98); opacity: 0; }
      }
      @keyframes eval-card-stay {
        0% { transform: translateY(16px) scale(0.94); opacity: 0; }
        8%, 94% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-6px) scale(0.98); opacity: 0; }
      }
      @keyframes eval-sunflower-bloom {
        0% { opacity: 0; transform: scale(0.25); }
        65% { opacity: 1; transform: scale(1.18); }
        100% { opacity: 1; transform: scale(1); }
      }

      .travel-fx-stage {
        position: relative; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        background: rgba(24, 48, 30, 0.58);
        animation: travel-backdrop-in 0.3s ease forwards;
      }
      .travel-fx-stage.out { animation: travel-backdrop-out 0.38s ease forwards; }
      .travel-fx-board {
        min-width: min(520px, 88vw); padding: 16px 28px;
        background: linear-gradient(180deg, #8a5a2b 0%, #7a4a21 100%);
        color: #fff3c4; border: 4px solid #3d2410;
        outline: 3px solid #ffd23f; outline-offset: -8px;
        box-shadow: 0 10px 0 #2b1b0e, 0 0 32px rgba(255, 210, 63, 0.55);
        display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
        animation: travel-board-in 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .travel-fx-stage.out .travel-fx-board { animation: travel-board-out 0.38s cubic-bezier(0.5, 0, 0.8, 0.4) forwards; }
      .travel-fx-route {
        display: inline-flex; align-items: center; gap: 12px;
        font-size: 26px; font-weight: bold; color: #ffd23f;
        text-shadow: 2px 2px 0 #2b1b0e;
      }
      .travel-fx-arrow {
        display: inline-block; color: #6abe30; font-size: 26px;
        animation: travel-arrow-hop 0.28s steps(2) infinite;
      }
      .travel-fx-sub { font-size: 18px; color: #f3e5be; }
      @keyframes travel-backdrop-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes travel-backdrop-out {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      @keyframes travel-board-in {
        from { transform: translateX(-160px) scale(0.86); opacity: 0; }
        to { transform: translateX(0) scale(1); opacity: 1; }
      }
      @keyframes travel-board-out {
        from { transform: translateX(0) scale(1); opacity: 1; }
        to { transform: translateX(160px) scale(0.92); opacity: 0; }
      }
      @keyframes travel-arrow-hop {
        from { transform: translateX(-3px); }
        to { transform: translateX(4px); }
      }
    </style>
  </head>
  <body>
    <header class="hud">
      <h1 id="hud-logo" class="brand-logo">青禾谷物语</h1>
      <button class="loc-pill" id="hud-loc" data-act="open-map" title="打开世界地图快速移动"></button>
      <span id="hud-date"></span>
      <span id="hud-gold"></span>
      <div id="hud-bars"></div>
      <button class="pix-btn sleep" data-act="sleep">睡觉</button>
      <span class="hud-player" id="hud-player" title="当前主角"></span>
      <button class="pix-btn ghost" data-act="open-settings">设置</button>
    </header>

    <nav class="page-nav" id="page-nav" aria-label="主页面切换"></nav>

    <main class="stage-wrap">
      <section class="panel" id="stage" aria-live="polite"></section>
    </main>

    <footer class="log-panel"><div id="log" aria-live="polite"></div></footer>

    <div id="fx-toast-layer" aria-live="polite"></div>
    <div id="page-refresh-layer" aria-hidden="true"></div>
    <div id="scene-fx-layer" aria-live="polite"></div>
    <div id="craft-reveal-layer" aria-live="polite"></div>
    <div id="ui-modal" role="dialog" aria-modal="true"><div id="ui-modal-card" class="modal-surface"></div></div>
    <div id="shop-modal" role="dialog" aria-modal="true"><div id="shop-modal-card" class="modal-surface"></div></div>
    <div id="modal" role="dialog" aria-modal="true"><div id="modal-card" class="modal-surface"></div></div>
    <div id="night"></div>
    <script src="app.js"></script>
  </body>
</html>
